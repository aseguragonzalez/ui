name: Dependency overrides watch

on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  check:
    name: Check if temporary overrides/allowlist entries are still needed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Run audit-ci and capture output
        id: audit
        continue-on-error: true
        run: |
          {
            echo "output<<AUDIT_EOF"
            npm run audit -- --show-not-found 2>&1 | tee /dev/stderr
            echo "AUDIT_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Open an issue if an allowlisted advisory is no longer present
        if: contains(steps.audit.outputs.output, 'Consider not allowlisting advisor')
        env:
          GH_TOKEN: ${{ github.token }}
          AUDIT_OUTPUT: ${{ steps.audit.outputs.output }}
        run: |
          TITLE="audit-ci.jsonc allowlist entry may no longer be needed"
          STALE=$(printf '%s\n' "$AUDIT_OUTPUT" \
            | grep -oE 'Consider not allowlisting advisor(y|ies): [A-Za-z0-9,. -]+' \
            | sed -E 's/Consider not allowlisting advisor(y|ies): //; s/\.$//' \
            | tr ',' '\n' | sed 's/^ *//;s/ *$//' | sort -u)

          {
            echo "The weekly [Dependency overrides watch](../actions/workflows/dependency-overrides-watch.yml) run detected that one or more entries in \`audit-ci.jsonc\` are no longer matched by the current dependency tree:"
            echo
            printf '%s\n' "$STALE" | sed 's/^/- /'
            echo
            echo "Please verify with \`npm run audit\`, and if confirmed, remove the corresponding entry from \`audit-ci.jsonc\`."
          } > /tmp/issue-body.md

          EXISTING=$(gh issue list --search "$TITLE in:title" --state open --json number --jq '.[0].number')
          if [ -n "$EXISTING" ]; then
            gh issue edit "$EXISTING" --body-file /tmp/issue-body.md
          else
            gh issue create --title "$TITLE" --body-file /tmp/issue-body.md --label dependencies
          fi
