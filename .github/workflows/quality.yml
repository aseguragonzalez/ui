name: Quality

on:
  workflow_call: {}

permissions:
  contents: read

jobs:
  quality:
    name: Lint, test and build
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Audit dependencies
        run: npm run audit

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test:coverage

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 7

      - name: Build
        run: npm run build

      - name: Verify publishable package
        run: node scripts/verify-package.mjs

      - name: Check unused components are tree-shaken
        run: node scripts/check-tree-shaking.mjs

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dist
          path: dist/
          retention-days: 1
